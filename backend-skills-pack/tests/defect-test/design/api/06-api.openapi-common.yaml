# ## Inputs
# - docs/design/06-api.md (Conventions, Errors, D6-5, D6-8, D6-13, D6-14).
# ## Decisions
# - Shared parameters, headers, schemas and problem responses for every module file (06-api.md D6-1).
# ## Open questions
# - See 06-api.md AQ-2, AQ-4, AQ-6, AQ-7.
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Kept 24 hours per caller and operation (D6-8, AQ-2). A replay with the same body returns the first
        response with Idempotent-Replayed true; another body gives 422 idempotency-key-reused.
      schema: {type: string, format: uuid}
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional; the operation is safe to retry without it (D6-9).
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from nextCursor of the previous page (D6-13).
      schema: {type: string, maxLength: 512}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  headers:
    IdempotentReplayed:
      description: true when the response is a stored replay (D6-8).
      schema: {type: boolean}
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 1}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with the "code" extension member (profile error_format, D6-5).
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference, examples: [/problems/owes-fines]}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
          description: Stable machine code from the 06-api.md Errors table. Clients treat an unknown code by its status.
        errors:
          type: array
          description: Only on validation-failed.
          items:
            type: object
            required: [pointer, code]
            properties:
              pointer: {type: string, description: JSON Pointer to the field}
              code: {type: string}
              detail: {type: string}
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 generated by the server (profile id_convention).
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: {type: integer, format: int64, description: Exact amount in minor units (D6-14)}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    NextCursor:
      type: [string, 'null']
      description: Null on the last page.
  responses:
    BadRequest:
      description: validation-failed, idempotency-key-required
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    Unauthenticated:
      description: unauthenticated
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    Forbidden:
      description: not-librarian, not-member, not-loan-owner, not-hold-owner (see x-error-codes)
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    NotFound:
      description: See x-error-codes of the operation.
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    Conflict:
      description: Uniqueness, duplicate open item, concurrency-conflict or idempotency-key-in-use (see x-error-codes).
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    Unprocessable:
      description: A domain rule is broken, or idempotency-key-reused (see x-error-codes).
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    TooManyRequests:
      description: rate-limited (D6-18, AQ-7)
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
