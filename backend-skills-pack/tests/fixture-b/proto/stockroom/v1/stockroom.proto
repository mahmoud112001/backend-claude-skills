// Prototype stub: the first operations the outbound shipping system needs.
// The rest of the API is not designed yet.
syntax = "proto3";

package stockroom.v1;

service StockService {
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc GetAvailability(GetAvailabilityRequest) returns (GetAvailabilityResponse);
}

message ReserveStockRequest {
  string request_id = 1;   // caller-generated, for retries
  string sku = 2;
  string warehouse_id = 3;
  int64 quantity = 4;
  string shipment_ref = 5; // the caller's shipment reference
}

message ReserveStockResponse {
  string reservation_id = 1;
}

message GetAvailabilityRequest {
  string sku = 1;
}

message GetAvailabilityResponse {
  repeated WarehouseAvailability warehouses = 1;
}

message WarehouseAvailability {
  string warehouse_id = 1;
  int64 on_hand = 2;
  int64 reserved = 3;
  int64 available = 4;
}
